# Production overrides — use with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Differences from base compose:
#   - Pulls pre-built images from GHCR instead of building locally
#   - SQLite data stored as bind-mount in ./data for easy backup
#   - JSON log driver with rotation on all services

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-ghcr-image: &ghcr-repo ghcr.io/sajjadsaharkhan/llmeter

services:
  backend:
    image: "${GHCR_REPO:-ghcr.io/sajjadsaharkhan/llmeter}/backend:${IMAGE_TAG:-main}"
    build: null
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --workers 2
    volumes:
      - ./data:/app/data   # bind-mount so the SQLite file lives on the host
    logging: *default-logging

  frontend:
    image: "${GHCR_REPO:-ghcr.io/sajjadsaharkhan/llmeter}/frontend:${IMAGE_TAG:-main}"
    build: null
    logging: *default-logging

  nginx:
    logging: *default-logging
